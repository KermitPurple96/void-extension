<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Void Container Setup</title></head>
<body style="background:#0d1117;color:#e6edf3;font-family:sans-serif;padding:40px;text-align:center">
<h2>Setting up container...</h2>
<p id="status">Registering...</p>
<script>
  const params = new URLSearchParams(location.search);
  const name = params.get("name");
  const redirect = params.get("redirect") || "about:blank";
  if (name) {
    chrome.storage.local.set({ voidContainerName: name }, () => {
      document.getElementById("status").textContent = "Registered as: " + name + ". Redirecting...";
      setTimeout(() => { location.href = redirect; }, 500);
    });
  } else {
    document.getElementById("status").textContent = "No container name provided.";
  }
</script>
</body></html>
